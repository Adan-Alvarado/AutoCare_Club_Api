info:
  name: Reserve
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/cart/reserve"
  headers:
    - name: Idempotency-Key
      value: "{{reservationKey}}"
  body:
    type: json
    data: |-
      {
        "vehicleId": "",
        "serviceId": "",
        "appointmentDate": "2026-10-01",
        "startTime": "09:00:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
